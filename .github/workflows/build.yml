name: 'Build'

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      httpbin:
        image: mccutchen/go-httpbin:2.25.0
        ports:
          - 8080:8080
    strategy:
      matrix:
        environment: [node, browser]
    name: Build (${{ matrix.environment }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: yarn
      - run: yarn install
      - run: yarn lint
      - uses: zcong1993/setup-timezone@master
        with:
          timezone: Europe/Brussels
      - if: matrix.environment == 'browser'
        run: npx playwright install --with-deps chromium
      - name: Wait for httpbin
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8080/status/200 > /dev/null; then
              echo "httpbin is up"
              exit 0
            fi
            sleep 1
          done
          echo "httpbin did not start in time" && exit 1
      - run: yarn test --project ${{ matrix.environment }}
        env:
          API_URL: https://api-staging-na.seatsio.net
          USAGE_REPORTING_TESTS_API_URL: https://api-staging-eu.seatsio.net
          USAGE_REPORTING_TESTS_SECRET_KEY: ${{ secrets.DEMO_COMPANY_SECRET_KEY }}
          CORE_V2_API_SECRET: ${{ secrets.CORE_V2_STAGING_NA_SYSTEM_API_SECRET }}
          HTTPBIN_URL: http://localhost:8080
